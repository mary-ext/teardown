registries:
  'https://npm.jsr.io/':
    scopes:
      - '@jsr'

allowBuilds:
  '@rolldown/browser': false
  esbuild: true
  sharp: false
  workerd: true

overrides:
  # wasm-runtime 1.2.6 requires @emnapi/core 2.0.0-beta.2, but @rolldown/browser pins 2.0.0-alpha.5
  '@rolldown/browser>@napi-rs/wasm-runtime': 1.2.5

minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@rolldown/*'
  - '@jsr/mary__*'
  - '@oomfware/*'
